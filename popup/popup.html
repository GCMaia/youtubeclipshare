<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouClip</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <!-- Text comes from _locales/ (data-i18n* attributes, filled in by popup.js); the English here is a fallback. -->
  <body>
    <header class="header">
      <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M9.64 7.64c.23-.5.36-1.05.36-1.64 0-2.21-1.79-4-4-4S2 3.79 2 6s1.79 4 4 4c.59 0 1.14-.13 1.64-.36L10 12l-2.36 2.36C7.14 14.13 6.59 14 6 14c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4c0-.59-.13-1.14-.36-1.64L12 14l7 7h3v-1L9.64 7.64zM6 8c-1.1 0-2-.89-2-2s.9-2 2-2 2 .89 2 2-.9 2-2 2zm0 12c-1.1 0-2-.89-2-2s.9-2 2-2 2 .89 2 2-.9 2-2 2zm6-7.5c-.28 0-.5-.22-.5-.5s.22-.5.5-.5.5.22.5.5-.22.5-.5.5zM19 3l-6 6 2 2 7-7V3h-3z" />
      </svg>
      <h1 data-i18n="shareClip">Share a clip</h1>
      <span id="length" class="length"></span>
    </header>

    <p id="message" class="message" hidden></p>

    <main id="picker" hidden>
      <p id="video-title" class="video-title"></p>

      <div class="row">
        <div class="field">
          <label for="start" data-i18n="start">Start</label>
          <div class="time">
            <input id="start" class="input" type="text" dir="ltr" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="0:00" />
            <button id="start-now" class="btn small" type="button" data-i18n="now" data-i18n-title="nowTooltip">Now</button>
          </div>
        </div>
        <div class="field">
          <label for="end" data-i18n="end">End</label>
          <div class="time">
            <input id="end" class="input" type="text" dir="ltr" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="0:00" />
            <button id="end-now" class="btn small" type="button" data-i18n="now" data-i18n-title="nowTooltip">Now</button>
          </div>
        </div>
      </div>

      <div class="segmented" role="group" data-i18n-aria-label="linkTypeLabel" aria-label="Link type">
        <button class="segment" type="button" data-link-type="everyone" data-i18n="linkEveryone">Link for everyone</button>
        <button class="segment" type="button" data-link-type="youtube" data-i18n="linkYouTube">YouTube link</button>
      </div>

      <!-- Optional; only used by "Link for everyone" links, so popup.js hides it for YouTube links. -->
      <div id="title-field" class="field title-field">
        <label for="clip-title" data-i18n="clipTitle">Clip title</label>
        <input id="clip-title" class="input" type="text" dir="auto" maxlength="100" autocomplete="off" data-i18n-placeholder="clipTitlePlaceholder" placeholder="Optional" />
      </div>

      <input id="link" class="input link" type="text" dir="ltr" readonly spellcheck="false" data-i18n-aria-label="clipLinkLabel" aria-label="Clip link" />
      <p id="error" class="error" role="status" aria-live="polite"></p>

      <div class="actions">
        <button id="cancel-preview" class="btn" type="button" data-i18n="cancelPreview" data-i18n-title="cancelPreviewTooltip" hidden>Cancel preview</button>
        <button id="preview" class="btn" type="button" data-i18n="preview" data-i18n-title="previewTooltip">Preview</button>
        <button id="copy" class="btn primary" type="button" data-i18n="copyClipLink">Copy clip link</button>
      </div>

      <p id="tip" class="hint">Tip: leave this open while the video plays and press <b>Now</b> at the start and end moments.</p>
    </main>

    <footer id="footer-hint" class="footer">Opens a page that plays just this clip, on any device, even without YouClip.</footer>

    <script src="../src/clip-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
