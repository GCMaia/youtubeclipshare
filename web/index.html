<!doctype html>
<!-- youclip.ca home page. Clip links (/watch/…) are served by watch.html through worker/index.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouClip</title>
    <meta name="description" content="YouClip shares the exact part of a YouTube video you mean. A personal, free and open-source project." />
    <meta property="og:title" content="YouClip" />
    <meta property="og:site_name" content="YouClip" />
    <meta property="og:description" content="Share the exact part of a YouTube video you mean. A personal, free and open-source project." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://youclip.ca/" />
    <meta property="og:image" content="https://youclip.ca/icon128.png" />
    <meta property="og:image:width" content="128" />
    <meta property="og:image:height" content="128" />
    <meta property="og:image:alt" content="YouClip" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0b0b0b" />
    <link rel="icon" href="/icon48.png" />
    <link rel="stylesheet" href="/player.css" />
    <script>
      // Older clip links in the /?v=<id>&t=<start>&end=<end> form go to the player.
      (function () {
        var query = new URLSearchParams(location.search);
        var id = query.get('v');
        if (id && /^[\w-]{11}$/.test(id) && query.get('end')) {
          query.delete('v');
          location.replace('/watch/' + id + '?' + query.toString());
        }
      })();
    </script>
  </head>
  <body>
    <main class="home">
      <h1 class="home-logo"><img src="/icon128.png" alt="YouClip" width="112" height="112" /></h1>
      <p class="home-lead">YouClip is a personal, free and open-source project.</p>

      <p class="home-intro">Some links you might be interested in:</p>
      <ul class="home-links">
        <li>
          <span class="home-label">Add YouClip as an extension to start sharing</span>
          <span class="home-soon">Coming soon</span>
        </li>
        <li>
          <span class="home-label">Privacy</span>
          <a href="/privacy">Privacy policy</a>
        </li>
        <li>
          <span class="home-label">Project</span>
          <a href="https://github.com/GCMaia/youtubeclipshare" rel="noopener">Source code on GitHub</a>
        </li>
      </ul>
    </main>

    <footer class="home-footer">
      <a class="pizza" href="https://buymeacoffee.com/gcmaia" rel="noopener"><span aria-hidden="true">🍕</span> Buy me a pizza</a>
    </footer>
  </body>
</html>
